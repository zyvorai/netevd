[package]
name = "netevd-hooks"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "netevd hook contract (event v1, debounce, match, dispatch)"
publish = false

[dependencies]
anyhow = "=1.0.86"
chrono = { version = "=0.4.38", default-features = false, features = ["clock", "std", "serde"] }
regex = "=1.10.6"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
serde_yaml = "=0.9.34"
tokio = { version = "=1.40.0", default-features = false, features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
tracing = "=0.1.40"

[dev-dependencies]
tempfile = "=3.10.1"
