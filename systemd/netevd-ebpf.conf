# /etc/systemd/system/netevd.service.d/ebpf.conf
# Drop-in used when netevd is built with --features ebpf.
# AmbientCapabilities replaces (does not merge) the unit Ambient set — keep DAC.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW CAP_BPF CAP_PERFMON CAP_DAC_READ_SEARCH
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW CAP_BPF CAP_PERFMON CAP_DAC_READ_SEARCH
# bpffs (maps) + ensure bpf/perf_event_open survive ~@privileged filters
ReadWritePaths=/sys/fs/bpf
SystemCallFilter=bpf perf_event_open
ProtectKernelTunables=false
